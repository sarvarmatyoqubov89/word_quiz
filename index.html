<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#5b4dff">
<meta name="description" content="Bolalar uçun rasmli söz qidiriş öyini (özbekça va rusça)">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Qitmirça harflar">
<title>Qitmirça harflar</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@700&family=Rubik:wght@500;700;800&family=Nunito:wght@500;700&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
[hidden]{display:none!important}
img{max-width:100%}
/* Layout: notebook-paper board, picture cards strip on top, grid below, one column on phones */
:root{
  --bg:#eef4fb; --paper:#ffffff; --ink:#1f3552; --muted:#5d7391; --line:#c9d8ea;
  --accent:#2f6fd0; --accent-ink:#ffffff; --sel:#ffd34d;
  --h1:#ff9f8f; --h2:#8fd3a8; --h3:#9fc1ff; --h4:#ffcf6e; --h5:#d4a6f2; --h6:#7fd8d8; --h7:#f6a6cf; --h8:#c3d97a;
  --hl-op:.55; --gold:#e8a800; --warn:#d93a3a;
  --display:"Rubik",system-ui,sans-serif; --body:"Nunito",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121a26; --paper:#1a2535; --ink:#e3ecf8; --muted:#93a6c0; --line:#2c3b52;
  --accent:#6aa2ff; --accent-ink:#0d1520; --sel:#c9a12a; --hl-op:.5; --warn:#ff6b6b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121a26; --paper:#1a2535; --ink:#e3ecf8; --muted:#93a6c0; --line:#2c3b52;
  --accent:#6aa2ff; --accent-ink:#0d1520; --sel:#c9a12a; --hl-op:.5; --warn:#ff6b6b; color-scheme:dark}
/* Board skins from the shop: self-contained colors, same in light and dark */
[data-skin="sea"]{--board-bg:linear-gradient(160deg,#e3f6ff,#b5e3f8);--board-ink:#0a6694;--board-line:rgba(10,102,148,.18);--board-border:#1d9fd6}
[data-skin="forest"]{--board-bg:linear-gradient(160deg,#eef8e6,#c9eab8);--board-ink:#2b6a2e;--board-line:rgba(43,106,46,.18);--board-border:#3f9b42}
[data-skin="candy"]{--board-bg:linear-gradient(160deg,#fff1f7,#ffd3e6);--board-ink:#b0306c;--board-line:rgba(176,48,108,.16);--board-border:#ef5fa7}
[data-skin="space"]{--board-bg:radial-gradient(circle at 18% 22%,rgba(255,255,255,.55) 0 1.5px,transparent 2.5px) 0 0/90px 90px,radial-gradient(circle at 70% 60%,rgba(255,255,255,.4) 0 1px,transparent 2px) 0 0/60px 60px,linear-gradient(160deg,#1b1442,#33246f);--board-ink:#ffe27a;--board-line:rgba(255,255,255,.12);--board-border:#8a6cff}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px}
.wrap{max-width:620px;margin:0 auto;padding-block:18px 40px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:14px}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
h1{font-family:var(--display);font-weight:800;font-size:1.6rem;margin:0;letter-spacing:-.01em;text-wrap:balance}
h1 span{color:var(--accent)}
.seg{display:inline-flex;flex-wrap:wrap;background:var(--paper);border:1.5px solid var(--line);border-radius:22px;padding:3px;gap:2px}
.seg button{font:700 .9rem var(--body);border:0;background:none;color:var(--muted);padding:6px 12px;border-radius:999px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.seg button:focus-visible,.btn:focus-visible{outline:3px solid var(--sel);outline-offset:2px}
.controls{display:flex;flex-wrap:wrap;gap:8px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px}
.card{background:var(--paper);border:1.5px solid var(--line);border-radius:14px;padding:8px 4px 6px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:2px;transition:transform .2s,opacity .3s}
.card:active{transform:scale(.96)}
.card .pic{font-size:2.2rem;line-height:1.1}
.card .w{font-family:var(--display);font-weight:700;font-size:.85rem;letter-spacing:.06em;text-align:center;word-break:break-word}
.card.found{opacity:.55}
.card.found .w{text-decoration:line-through;text-decoration-thickness:2px}
.card.hint{transform:scale(1.08);border-color:var(--sel)}
.hide-words .card:not(.found) .w{color:transparent;text-shadow:none;background:var(--line);border-radius:6px;min-width:60%}
.board{position:relative;background:var(--board-bg,var(--paper));border:2px solid var(--board-border,var(--accent));border-radius:12px;padding:6px;
  container-type:inline-size;touch-action:none;user-select:none;-webkit-user-select:none}
.grid{position:relative;display:grid;grid-template-columns:repeat(var(--n),1fr);z-index:1}
.cell{aspect-ratio:1;display:flex;align-items:center;justify-content:center;
  border-right:1px solid var(--board-line,var(--line));border-bottom:1px solid var(--board-line,var(--line));
  font-family:var(--display);font-weight:500;color:var(--board-ink,var(--accent));font-size:calc(100cqw / var(--n) * .5);cursor:pointer}
.cell.wide{font-size:calc(100cqw / var(--n) * .38)}
.cell.lastc{border-right:0} .cell.lastr{border-bottom:0}
.cell.pend{background:color-mix(in srgb,var(--sel) 60%,transparent);border-radius:50%}
.cell.flash{animation:fl .5s 3}
@keyframes fl{50%{background:var(--sel)}}
svg.lines{position:absolute;inset:6px;width:calc(100% - 12px);height:calc(100% - 12px);z-index:0;pointer-events:none}
svg.lines line{stroke-linecap:round;stroke-width:.72;opacity:var(--hl-op)}
svg.lines line.live{stroke:var(--sel);opacity:.8}
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.score{font-family:var(--display);font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.btn{font:700 .95rem var(--body);border:1.5px solid var(--line);background:var(--paper);color:var(--ink);
  padding:9px 16px;border-radius:12px;cursor:pointer}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.win{position:absolute;inset:0;z-index:3;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;
  background:color-mix(in srgb,var(--paper) 88%,transparent);border-radius:12px;text-align:center}
.win b{font-family:var(--display);font-size:2rem;color:var(--accent)}
.win .big{font-size:3.4rem;animation:pop .6s ease-out}
@keyframes pop{0%{transform:scale(.3)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
.hdr-r{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.coins{font-family:var(--display);font-weight:800;font-size:1.05rem;padding:7px 12px;border-radius:999px;color:var(--ink);
  background:color-mix(in srgb,var(--gold) 24%,var(--paper));border:1.5px solid var(--gold);font-variant-numeric:tabular-nums;transition:transform .2s}
.coins.bump{transform:scale(1.18)}
.set-btn{width:42px;height:42px;padding:0;font-size:1.25rem;display:inline-flex;align-items:center;justify-content:center;border-radius:50%}
.set-btn span{transition:transform .3s}
.set-btn[aria-expanded="true"]{background:var(--accent);border-color:var(--accent)}
#setBtn[aria-expanded="true"] span{transform:rotate(90deg)}
.panel{padding:12px;background:var(--paper);border:1.5px solid var(--line);border-radius:14px}
.settings{display:flex;flex-wrap:wrap;gap:8px}
.settings .seg{background:var(--bg)}
.gain{position:absolute;z-index:2;transform:translate(-50%,-50%);font-family:var(--display);font-weight:800;font-size:1.5rem;
  color:var(--ink);background:color-mix(in srgb,var(--gold) 55%,var(--paper));padding:2px 10px;border-radius:999px;pointer-events:none;
  animation:up 1.2s ease-out forwards}
@keyframes up{0%{opacity:0;margin-top:10px}20%{opacity:1}100%{opacity:0;margin-top:-50px}}
.card .val{font-size:.72rem;font-weight:700;color:var(--muted)}
.bonus-row{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-weight:700;font-size:.9rem;color:var(--muted)}
.bonus-row .chip{font-family:var(--display);letter-spacing:.05em;color:var(--ink);padding:3px 10px;border-radius:999px;
  background:color-mix(in srgb,var(--gold) 28%,var(--paper));border:1.5px solid var(--gold)}
svg.lines line.bonus{stroke:var(--gold);stroke-dasharray:.25 .2;opacity:.75}
.how{color:var(--ink);font-size:.95rem;line-height:1.5;margin:0;max-width:60ch}
.info-btn span{font-family:Georgia,"Times New Roman",serif;font-style:italic;font-weight:700;font-size:1.35rem;color:var(--accent)}
.info-btn[aria-expanded="true"] span{color:var(--accent-ink)}
.shop-head{display:flex;flex-direction:column;gap:2px;margin-bottom:10px}
.shop-head b{font-family:var(--display);font-size:1.15rem}
.shop-head span{color:var(--muted);font-size:.88rem}
.shop-sec{font:700 .78rem var(--body);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:10px 0 6px}
.shop-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:8px}
.item{display:flex;flex-direction:column;gap:6px;padding:8px;border:1.5px solid var(--line);border-radius:12px;background:var(--bg)}
.item .nm{font-weight:700;font-size:.92rem}
.item .btn{padding:7px 10px;font-size:.88rem;width:100%}
.sw{height:52px;border-radius:9px;display:flex;align-items:center;justify-content:center;
  background:var(--board-bg,var(--paper));border:2px solid var(--board-border,var(--accent));
  color:var(--board-ink,var(--accent));font:700 1.05rem var(--display);letter-spacing:.3em}
.sw.emo{letter-spacing:.1em;font-size:1.4rem;background:var(--paper);border-color:var(--line)}
.card .pic img{width:2.6rem;height:2.6rem;object-fit:cover;border-radius:10px;display:block}
.empty{grid-column:1/-1;margin:0;padding:12px;color:var(--muted);text-align:center;background:var(--paper);border:1.5px dashed var(--line);border-radius:14px}
.timer{display:flex;flex-direction:column;gap:8px}
.t-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.t-clock{font:800 1.7rem var(--display);font-variant-numeric:tabular-nums;min-width:4.2ch}
.t-stats{font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.t-prog{height:10px;background:var(--line);border-radius:99px;overflow:hidden}
.t-prog i{display:block;height:100%;width:100%;background:var(--accent);border-radius:99px;transition:width .25s linear}
.t-tip{font-size:.85rem;color:var(--muted)}
.timer.warn .t-clock{color:var(--warn)}
.timer.warn .t-prog i{background:var(--warn)}
.win p{margin:0;font-weight:700;font-size:1.1rem}
.win .rec{color:var(--gold);font-family:var(--display);font-weight:800}
.full{width:100%}
.p-title{font-family:var(--display);font-size:1.15rem;display:block}
.p-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px}
.p-head .btn{padding:6px 12px;font-size:.88rem}
.p-note{color:var(--muted);font-size:.88rem;margin:0 0 10px}
.gate{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.inp{font:600 1rem var(--body);color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:9px 11px;min-width:0}
.inp:focus{outline:3px solid var(--sel);outline-offset:1px}
.p-form{display:grid;grid-template-columns:auto 1fr 1fr;gap:8px;align-items:center}
.p-form .actions{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
@media (max-width:460px){.p-form{grid-template-columns:auto 1fr}.p-form .ru{grid-column:2}}
.pic-pick{width:56px;height:56px;border-radius:12px;border:1.5px dashed var(--line);background:var(--bg);display:flex;align-items:center;justify-content:center;
  font-size:1.6rem;cursor:pointer;overflow:hidden;position:relative}
.pic-pick img{width:100%;height:100%;object-fit:cover}
.pic-pick input{position:absolute;inset:0;opacity:0;cursor:pointer}
.err{color:var(--warn);font-weight:700;font-size:.88rem}
.p-list{list-style:none;margin:12px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
.p-list li{display:flex;align-items:center;gap:10px;padding:6px 8px;background:var(--bg);border-radius:10px}
.p-list .pp{width:36px;height:36px;font-size:1.6rem;display:flex;align-items:center;justify-content:center}
.p-list .pp img{width:36px;height:36px;object-fit:cover;border-radius:8px}
.p-list .wd{flex:1;min-width:0;font-weight:700;overflow-wrap:anywhere}
.p-list .wd span{color:var(--muted);font-weight:600}
.p-list button{border:0;background:none;color:var(--muted);font-size:1.2rem;cursor:pointer;padding:4px 8px;border-radius:8px}
.p-list button:hover{color:var(--warn)}
.emo-in{width:56px;text-align:center;font-size:1.4rem;padding:8px 4px}
.splash{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(160deg,#4d8dff,#7b4dff);transition:opacity .5s ease}
.splash-in{display:flex;flex-direction:column;align-items:center;gap:22px;padding:24px}
.splash img{width:min(62vw,340px);aspect-ratio:1;border-radius:22%;box-shadow:0 18px 50px rgba(20,10,80,.35);animation:pop .7s ease-out}
.splash-t{font-family:"Fredoka","Rubik",system-ui,sans-serif;font-weight:700;font-size:clamp(2.4rem,11vw,3.6rem);line-height:1.02;text-align:center}
.splash-t span{display:inline-block;color:var(--c);-webkit-text-stroke:2px #2a1a66;paint-order:stroke fill;
  text-shadow:0 5px 0 rgba(30,15,90,.35);animation:hop .6s cubic-bezier(.3,1.6,.5,1) both;animation-delay:var(--d)}
@keyframes hop{0%{transform:translateY(30px) scale(.6);opacity:0}100%{transform:none;opacity:1}}
.splash.out{opacity:0;pointer-events:none}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

}

function build(reset){

  let pool=allWords().filter(w=>S.cat==="all"?catOpen(w[3]):w[3]===S.cat)
    .map(w=>({pic:w[0],word:S.lang==="ru"?w[1]:w[2],other:ol==="ru"?w[1]:w[2]}))
    .filter(o=>o.word&&(S.mode!=="bi"||o.other))
    .map(o=>({...o,t:tok(o.word,S.lang)})).filter(o=>o.t.length>=3&&o.t.length<=n);
  pool=shuffle(pool);
  const grid=Array.from({length:n},()=>Array(n).fill(null)), words=[];
  for(const w of pool){
    if(words.length>=L.k)break;
    if(words.some(x=>x.word.includes(w.word)||w.word.includes(x.word)))continue;
    for(let tries=0;tries<300;tries++){
      const [dr,dc]=L.d[rnd(L.d.length)], len=w.t.length;
      const r0=rnd(n),c0=rnd(n), r1=r0+dr*(len-1), c1=c0+dc*(len-1);
      if(r1<0||r1>=n||c1<0||c1>=n)continue;
      let ok=true;
      for(let i=0;i<len;i++){const v=grid[r0+dr*i][c0+dc*i];if(v&&v!==w.t[i]){ok=false;break}}
      if(!ok)continue;
      for(let i=0;i<len;i++)grid[r0+dr*i][c0+dc*i]=w.t[i];
      const o={...w,r0,c0,r1,c1,found:false};o.val=wordValue(o);words.push(o);break;
    }
  }
  // hidden bonus words: not on the cards, preferably from another topic
  const shown=new Set(words.map(w=>w.word)),hidden=[];
  const bonusPool=shuffle(allWords().filter(w=>catOpen(w[3])).map(w=>({word:S.lang==="ru"?w[1]:w[2],cat:w[3]}))
    .filter(o=>o.word&&!shown.has(o.word)).map(o=>({...o,t:tok(o.word,S.lang)})).filter(o=>o.t.length>=3&&o.t.length<=Math.min(n,7)))
    .sort((a,b)=>(a.cat===S.cat)-(b.cat===S.cat));
  for(const w of bonusPool){
    if(hidden.length>=BONUS_N[S.lv])break;
    if([...words,...hidden].some(x=>x.word.includes(w.word)||w.word.includes(x.word)))continue;
    for(let tries=0;tries<300;tries++){
      const [dr,dc]=L.d[rnd(L.d.length)], len=w.t.length;
      const r0=rnd(n),c0=rnd(n), r1=r0+dr*(len-1), c1=c0+dc*(len-1);
      if(r1<0||r1>=n||c1<0||c1>=n)continue;
      let ok=true;
      for(let i=0;i<len;i++){const v=grid[r0+dr*i][c0+dc*i];if(v&&v!==w.t[i]){ok=false;break}}
      if(!ok)continue;
      for(let i=0;i<len;i++)grid[r0+dr*i][c0+dc*i]=w.t[i];
      hidden.push({word:w.word,t:w.t});break;
    }
  }
  const f=FILL[S.lang];
  for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(!grid[r][c])grid[r][c]=f[rnd(f.length)];
  // every known word of this language counts as a bonus, also ones formed by chance
  const dict=new Set(allWords().map(w=>S.lang==="ru"?w[1]:w[2]).filter(x=>x&&tok(x,S.lang).length>=3&&!shown.has(x)));
  G={n,grid,words:words.sort(()=>Math.random()-.5),ci:0,hintCost:HINT_START,hidden,dict,bonus:[]};pend=null;if(reset)S.coins=0;
  render();
}

}
function drawLines(live){
  let s=G.bonus.map(b=>lineEl(b.r0,b.c0,b.r1,b.c1,null,"bonus")).join("")+G.words.filter(w=>w.found).map(w=>lineEl(w.r0,w.c0,w.r1,w.c1,w.color)).join("");
  if(live)s+=lineEl(...live,null,"live");
  $("lines").innerHTML=s;
}
function cellAt(x,y){const el=document.elementFromPoint(x,y);return el&&el.classList.contains("cell")?[+el.dataset.r,+el.dataset.c]:null}
function snap(a,b){
  const dr=b[0]-a[0],dc=b[1]-a[1];
  if(dr===0||dc===0||Math.abs(dr)===Math.abs(dc))return b;
  if(Math.abs(dr)>Math.abs(dc))return Math.abs(dc)*2<Math.abs(dr)?[b[0],a[1]]:[a[0]+Math.sign(dr)*Math.abs(dc),b[1]];
  return Math.abs(dr)*2<Math.abs(dc)?[a[0],b[1]]:[b[0],a[1]+Math.sign(dc)*Math.abs(dr)];
}
function tryBonus(a,b,seq){
  if(seq.length<3)return false;
  const fw=seq.join(""),bw=[...seq].reverse().join("");
  const word=G.dict.has(fw)?fw:G.dict.has(bw)?bw:null;
  if(!word||G.bonus.some(x=>x.word===word))return false;
  G.bonus.push({word,r0:a[0],c0:a[1],r1:b[0],c1:b[1]});
  S.coins+=BONUS_VAL;
  const g=document.createElement("div");g.className="gain";g.textContent=`🎁 +${BONUS_VAL} 🪙`;
  g.style.left=`calc(6px + (100% - 12px) * ${((a[1]+b[1])/2+.5)/G.n})`;
  g.style.top=`calc(6px + (100% - 12px) * ${((a[0]+b[0])/2+.5)/G.n})`;
  board.appendChild(g);setTimeout(()=>g.remove(),1300);
  drawLines();updateScore();updateCoins(true);
  sfx("coin");setTimeout(()=>sfx("find"),120);say(word,S.lang);
  if(S.play==="time"&&TM&&!TM.over){TM.count++;renderTimer()}
  return true;
}
function tryWord(a,b){
  const dr=Math.sign(b[0]-a[0]),dc=Math.sign(b[1]-a[1]),len=Math.max(Math.abs(b[0]-a[0]),Math.abs(b[1]-a[1]))+1;
  const seq=[];for(let i=0;i<len;i++)seq.push(G.grid[a[0]+dr*i][a[1]+dc*i]);
  const s=seq.join("|"),rs=[...seq].reverse().join("|");
  const w=G.words.find(w=>!w.found&&(w.t.join("|")===s||w.t.join("|")===rs));
  if(!w)return tryBonus(a,b,seq);
  w.found=true;w.color=COLORS[G.ci++%COLORS.length];
  $("card"+G.words.indexOf(w)).classList.add("found");
  S.coins+=w.val;
  const g=document.createElement("div");g.className="gain";g.textContent=`+${w.val} 🪙`;
  g.style.left=`calc(6px + (100% - 12px) * ${((w.c0+w.c1)/2+.5)/G.n})`;
  g.style.top=`calc(6px + (100% - 12px) * ${((w.r0+w.r1)/2+.5)/G.n})`;
  board.appendChild(g);setTimeout(()=>g.remove(),1300);
  drawLines();updateScore();updateCoins(true);
  const all=G.words.every(x=>x.found);
  sfx(all?"win":"find");sayWord(w);
  if(S.play==="time"&&TM&&!TM.over){
    TM.count++;renderTimer();
    if(all)setTimeout(()=>{if(!TM.over)build(false)},900);
  }
  return true;
}
function clearPend(){document.querySelectorAll(".cell.pend").forEach(c=>c.classList.remove("pend"))}

const board=$("board");
board.addEventListener("pointerdown",e=>{
  ac();
  const p=cellAt(e.clientX,e.clientY);if(!p)return;
  startTimer();
  drag={a:p,b:p};board.setPointerCapture(e.pointerId);drawLines([...p,...p]);
});
board.addEventListener("pointermove",e=>{
  if(!drag)return;const p=cellAt(e.clientX,e.clientY);if(!p)return;
  drag.b=snap(drag.a,p);drawLines([...drag.a,...drag.b]);
});
function endDrag(){
  if(!drag)return;const {a,b}=drag;drag=null;
  if(a[0]===b[0]&&a[1]===b[1]){
    if(pend&&!(pend[0]===a[0]&&pend[1]===a[1])){
      const e2=snap(pend,a);clearPend();const ok=tryWord(pend,e2);pend=null;if(!ok){drawLines();sfx("miss")}return;
    }
    clearPend();
    if(pend){pend=null;drawLines();return}
    pend=a;document.querySelector(`.cell[data-r="${a[0]}"][data-c="${a[1]}"]`).classList.add("pend");drawLines();return;
  }
  pend=null;clearPend();if(!tryWord(a,b)){drawLines();sfx("miss")}
}
board.addEventListener("pointerup",endDrag);
board.addEventListener("pointercancel",()=>{drag=null;drawLines()});

/* ---------- 2-minute mode ---------- */
const LIMIT=120;
let TM=null;
const bestKey=()=>`best-${S.lang}-${S.lv}`;
function resetTimer(){
  if(TM)clearInterval(TM.iv);
  TM={left:LIMIT,count:0,started:false,over:false,end:0,iv:null};
  $("timeup").hidden=true;
  renderTimer();
}
function startTimer(){
  if(S.play!=="time"||!TM||TM.started||TM.over)return;
  TM.started=true;TM.end=Date.now()+LIMIT*1000;TM.iv=setInterval(tick,200);renderTimer();
}
function tick(){
  const left=Math.max(0,Math.ceil((TM.end-Date.now())/1000));
  if(left!==TM.left){TM.left=left;if(left>0&&left<=5)sfx("tick");renderTimer()}
  if(left<=0)timeUp();
}
function timeUp(){
  clearInterval(TM.iv);TM.over=true;drag=null;pend=null;clearPend();drawLines();
  const tr=T[S.lang],best=+store.get(bestKey(),"0")||0,rec=TM.count>best;
  if(rec)store.set(bestKey(),String(TM.count));
  $("tuN").textContent=tr.tuN(TM.count);
  $("tuR").textContent=rec?tr.tuRec:tr.tuBest(best);
  $("win").hidden=true;$("timeup").hidden=false;
  sfx(rec?"win":"end");renderTimer();updateCoins();
}
function renderTimer(){
  const on=S.play==="time";$("timer").hidden=!on;
  if(!on){$("timeup").hidden=true;return}
  if(!TM)resetTimer();
  const tr=T[S.lang],m=Math.floor(TM.left/60),s=TM.left%60;
  $("tClock").textContent=`${m}:${String(s).padStart(2,"0")}`;
  $("tStats").textContent=tr.tStats(TM.count,+store.get(bestKey(),"0")||0);
  $("tProg").style.width=`${TM.left/LIMIT*100}%`;
  $("tTip").hidden=TM.started;
  $("timer").classList.toggle("warn",TM.started&&TM.left<=10);
}
function restart(resetCoins){resetTimer();build(resetCoins)}

/* ---------- parents ---------- */
let gateOpen=false,gateQ=null,draft={emo:"",img:""};
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function renderParent(){
  const tr=T[S.lang],P=$("parent");
  if(!gateOpen){
    if(!gateQ)gateQ=[rnd(5)+4,rnd(5)+4];
    P.innerHTML=`<div class="p-head"><b class="p-title">${tr.pTitle}</b><button class="btn" id="pClose">${tr.pClose}</button></div><div class="gate"><label for="gateIn">${tr.gateQ(...gateQ)}</label>
      <input class="inp" id="gateIn" inputmode="numeric" autocomplete="off" style="width:5.5rem">
      <button class="btn primary" id="gateOk">${tr.gateOk}</button><span class="err" id="gateErr"></span></div>`;
    return;
  }
  const list=CUSTOM.length?CUSTOM.map(c=>`<li><span class="pp">${c.img?`<img src="${c.img}" alt="">`:esc(c.emo||"📝")}</span>
      <span class="wd">${esc(c.uz?fmt(c.uz,"uz"):"—")} <span>/ ${esc(c.ru||"—")}</span></span>
      <button data-del="${c.id}" aria-label="×">✕</button></li>`).join(""):`<li><span class="wd"><span>${tr.pNone}</span></span></li>`;
  P.innerHTML=`<div class="p-head"><b class="p-title">${tr.pTitle}</b><button class="btn" id="pClose">${tr.pClose}</button></div><p class="p-note">${tr.pNote}</p>
    <div class="p-form">
      <div style="display:flex;gap:6px">
        <input class="inp emo-in" id="pEmo" maxlength="8" placeholder="🙂" aria-label="Emoji" value="${esc(draft.emo)}">
        <label class="pic-pick" title="${tr.pPhoto}">${draft.img?`<img src="${draft.img}" alt="">`:"📷"}<input type="file" id="pImg" accept="image/*" aria-label="${tr.pPhoto}"></label>
      </div>
      <input class="inp" id="pUz" placeholder="${tr.pUz}" autocomplete="off" autocapitalize="characters" aria-label="${tr.pUz}">
      <input class="inp ru" id="pRu" placeholder="${tr.pRu}" autocomplete="off" autocapitalize="characters" aria-label="${tr.pRu}">
      <div class="actions"><button class="btn primary" id="pAdd">${tr.pAdd}</button><span class="err" id="pErr"></span></div>
    </div>
    <ul class="p-list">${list}</ul>
    <div class="shop-sec">💾</div><p class="p-note">${tr.bNote}</p>
    <div class="controls"><button class="btn" id="bSave">${tr.bSave}</button>
      <label class="btn" style="position:relative;overflow:hidden">${tr.bLoad}<input type="file" id="bLoad" accept=".json,application/json" style="position:absolute;inset:0;opacity:0;cursor:pointer"></label>
      <span class="err" id="bMsg"></span></div>`;
}
// Accepts both spellings (Oʻ, G', Sh, Ch) and stores the new alphabet (Ö, Ğ, Ş, Ç)
function normUz(s){
  return s.trim().toUpperCase().replace(/O\s*['‘’`ʻʼ´]/g,"Ö").replace(/G\s*['‘’`ʻʼ´]/g,"Ğ").replace(/SH/g,"Ş").replace(/CH/g,"Ç");
}
function addCustom(){
  const tr=T[S.lang],err=m=>{$("pErr").textContent=m};
  const uz=normUz($("pUz").value),ru=$("pRu").value.trim().toUpperCase(),emo=$("pEmo").value.trim();
  if(!uz&&!ru)return err(tr.eNeed);
  if(CUSTOM.length>=60)return err(tr.eMax);
  if(uz){
    if(!/^[A-ZÖĞŞÇ]+$/.test(uz))return err(tr.eUz);
    const n=tok(uz,"uz").length;if(n<3||n>12)return err(tr.eLen);
  }
  if(ru){
    if(!/^[А-ЯЁ]+$/.test(ru))return err(tr.eRu);
    if(ru.length<3||ru.length>12)return err(tr.eLen);
  }
  CUSTOM.push({id:Date.now().toString(36)+rnd(1e4),uz,ru,emo:emo||"",img:draft.img||""});
  saveCustom();draft={emo:"",img:""};
  sfx("coin");render();renderParent();
}
function loadPhoto(file){
  const tr=T[S.lang],r=new FileReader();
  r.onload=()=>{const im=new Image();im.onload=()=>{
      const c=document.createElement("canvas"),z=160;c.width=c.height=z;
      const k=Math.min(im.width,im.height),sx=(im.width-k)/2,sy=(im.height-k)/2;
      c.getContext("2d").drawImage(im,sx,sy,k,k,0,0,z,z);
      draft.emo=$("pEmo").value;draft.img=c.toDataURL("image/jpeg",.8);renderParent();
    };im.onerror=()=>{$("pErr").textContent=tr.eImg};im.src=r.result};
  r.onerror=()=>{$("pErr").textContent=tr.eImg};
  r.readAsDataURL(file);
}
document.addEventListener("visibilitychange",()=>{if(document.hidden&&gateOpen){openPanel("")}});
function backupData(){
  const best={};try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k.startsWith(NS+"best-"))best[k.slice(NS.length)]=localStorage.getItem(k)}}catch(e){}
  return {app:"qitmircha-harflar",v:1,date:new Date().toISOString(),custom:CUSTOM,owned:[...owned],skin:S.skin,best};
}
function saveBackup(){
  const blob=new Blob([JSON.stringify(backupData())],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);
  a.download=`qitmircha-zaxira-${new Date().toISOString().slice(0,10)}.json`;
  document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);
}
function loadBackup(file){
  const tr=T[S.lang],r=new FileReader();
  r.onload=()=>{
    let d;try{d=JSON.parse(r.result)}catch(e){d=null}
    if(!d||d.app!=="qitmircha-harflar"||!Array.isArray(d.custom)){$("bMsg").textContent=tr.bBad;return}
    const ids=new Set(CUSTOM.map(c=>c.id));let n=0;
    for(const c of d.custom){if(c&&c.id&&!ids.has(c.id)&&CUSTOM.length<60&&(c.uz||c.ru)){CUSTOM.push({id:c.id,uz:c.uz||"",ru:c.ru||"",emo:c.emo||"",img:c.img||""});n++}}
    saveCustom();
    (d.owned||[]).forEach(x=>owned.add(x));saveOwned();
    for(const [k,v] of Object.entries(d.best||{})){if((+v||0)>(+store.get(k,"0")||0))store.set(k,String(v))}
    sfx("coin");render();renderParent();$("bMsg").textContent=tr.bOk(n);
  };
  r.readAsText(file);
}
document.addEventListener("change",e=>{
  if(e.target.id==="pImg"&&e.target.files[0])loadPhoto(e.target.files[0]);
  if(e.target.id==="bLoad"&&e.target.files[0])loadBackup(e.target.files[0]);
});
document.addEventListener("keydown",e=>{
  if(e.key!=="Enter")return;
  if(e.target.id==="gateIn")$("gateOk").click();
  else if(["pUz","pRu","pEmo"].includes(e.target.id))$("pAdd").click();
});

function openPanel(id){
  const panels={setBtn:"settings",infoBtn:"infoPanel",shopBtn:"shop",parentBtn:"parent"};
  for(const [btn,pid] of Object.entries(panels)){
    const open=btn===id&&$(pid).hidden;
    $(pid).hidden=!open;$(btn).setAttribute("aria-expanded",open);
  }
  if(!$("shop").hidden)renderShop();
  if(!$("parent").hidden)renderParent();
  else lockParent();
}
// leaving the parents section always locks it again
function lockParent(){gateOpen=false;gateQ=null;draft={emo:"",img:""}}
function saveOwned(){store.set("owned",JSON.stringify([...owned]))}

document.addEventListener("click",e=>{
  ac();
  const card=e.target.closest(".card");
  if(card){const w=G.words[+card.dataset.i];if(w&&(!S.hide||w.found))sayWord(w);return}
  const b=e.target.closest("button");if(!b)return;
  if(b.dataset.lang){S.lang=b.dataset.lang;store.set("lang",S.lang);restart()}
  else if(b.dataset.cat){
    if(!catOpen(b.dataset.cat)){openPanel("shopBtn");return}
    S.cat=b.dataset.cat;store.set("cat",S.cat);restart()}
  else if(b.dataset.lv){S.lv=+b.dataset.lv;store.set("lv",S.lv);restart()}
  else if(b.dataset.play){S.play=b.dataset.play;store.set("play",S.play);restart()}
  else if(b.dataset.mode){S.mode=b.dataset.mode;store.set("mode",S.mode);restart()}
  else if(b.dataset.snd){S.sound=b.dataset.snd==="1";store.set("sound",S.sound?"1":"0");render();if(S.sound)sfx("coin");else if(canSpeak)speechSynthesis.cancel()}
  else if(b.dataset.buy){
    const it=SHOP.find(i=>i.id===b.dataset.buy);if(!it||owned.has(it.id)||S.coins<it.price)return;
    S.coins-=it.price;owned.add(it.id);saveOwned();sfx("coin");
    if(it.type==="skin"){S.skin=it.skin;store.set("skin",S.skin);$("board").dataset.skin=S.skin}
    else render();
    updateCoins(true);renderShop();
  }
  else if(b.dataset.skinpick){S.skin=b.dataset.skinpick;store.set("skin",S.skin);$("board").dataset.skin=S.skin;renderShop()}
  else if(b.dataset.playcat){S.cat=b.dataset.playcat;store.set("cat",S.cat);openPanel("");restart()}
  else if(b.id==="newBtn"||b.id==="again")restart(true);
  else if(b.id==="tuAgain")restart(false);
  else if(b.id==="nextBtn"||b.id==="nextWin")build(false);
  else if(b.id==="hideBtn"){S.hide=!S.hide;store.set("hide",S.hide?"1":"0");render()}
  else if(b.id==="setBtn"||b.id==="infoBtn"||b.id==="shopBtn")openPanel(b.id);
  else if(b.id==="parentBtn"){$("settings").hidden=true;$("setBtn").setAttribute("aria-expanded",false);openPanel("parentBtn")}
  else if(b.id==="gateOk"){if(+$("gateIn").value===gateQ[0]*gateQ[1]){gateOpen=true;renderParent()}else{$("gateErr").textContent=T[S.lang].gateErr;gateQ=null;setTimeout(renderParent,900)}}
  else if(b.id==="pAdd")addCustom();
  else if(b.id==="bSave")saveBackup();
  else if(b.id==="pClose")openPanel("");
  else if(b.dataset.del){CUSTOM=CUSTOM.filter(c=>c.id!==b.dataset.del);saveCustom();if(!catShown(S.cat)){S.cat="all";store.set("cat","all");restart()}else render();renderParent()}
  else if(b.id==="hintBtn"){
    const left=G.words.filter(w=>!w.found);if(!left.length||S.coins<G.hintCost)return;
    S.coins-=G.hintCost;G.hintCost++;updateCoins(true);sfx("hint");
    const w=left[rnd(left.length)],i=G.words.indexOf(w);
    const cell=document.querySelector(`.cell[data-r="${w.r0}"][data-c="${w.c0}"]`);
    const card=$("card"+i);
    cell.classList.remove("flash");void cell.offsetWidth;cell.classList.add("flash");
    card.classList.add("hint");setTimeout(()=>card.classList.remove("hint"),1500);
  }
});
(function(){const sp=$("splash");if(!sp)return;let gone=false;
  const hide=()=>{if(gone)return;gone=true;sp.classList.add("out");setTimeout(()=>sp.remove(),600)};
  sp.addEventListener("click",hide);setTimeout(hide,2300)})();
resetTimer();
build();
</script>

if("serviceWorker" in navigator){window.addEventListener("load",()=>{navigator.serviceWorker.register("sw.js").catch(()=>{})})}
